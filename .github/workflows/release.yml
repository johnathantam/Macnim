name: Release Macnim

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild \
            -project Macnim.xcodeproj \
            -scheme Macnim \
            -configuration Release \
            -derivedDataPath build \
            build

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Macnim
          path: build/Build/Products/Release/Macnim.app
