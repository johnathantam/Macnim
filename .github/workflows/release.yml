name: Release Macnim

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Macnim
        run: |
          xcodebuild \
            -project Macnim.xcodeproj \
            -scheme Macnim \
            -configuration Release \
            -derivedDataPath build \
            build

      - name: Create DMG
        run: |
          mkdir -p dmg
          cp -R build/Build/Products/Release/Macnim.app dmg/
          hdiutil create \
            -volname "Macnim" \
            -srcfolder dmg \
            -ov \
            -format UDZO \
            Macnim.dmg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Macnim.dmg